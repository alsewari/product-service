version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: products-mongodb
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb-data:/data/db
    networks:
      - products-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: products-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - products-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb-data:
  redis-data:

networks:
  products-network:
    driver: bridge
